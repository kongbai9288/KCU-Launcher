name: Build

env:
  # secrets 不能直接用在 step 级 if，先在这里求值
  HAS_KEYSTORE: ${{ secrets.KCU_KEYSTORE_BASE64 != '' }}

on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".github/workflows/**"
      - "**.md"
      - "version_map.json"
      - "docs/**"
  pull_request:
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构"
        required: false
        default: "all"
        type: choice
        options: ["all", "arm", "arm64", "x86", "x86_64"]
  workflow_call:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false
    env:
      MATRIX_ARCH: ${{ github.event.inputs.arch || matrix.arch }}
      # 全部走 secrets / 环境变量，读不到就是空，不允许让构建失败
      KCU_KEYSTORE_PASSWORD: ${{ secrets.KCU_KEYSTORE_PASSWORD }}
      KCU_KEY_ALIAS: ${{ secrets.KCU_KEY_ALIAS }}
      KCU_KEY_PASSWORD: ${{ secrets.KCU_KEY_PASSWORD }}
      CURSE_API_KEY: ${{ secrets.CURSE_API_KEY }}
      OAUTH_API_KEY: ${{ secrets.OAUTH_API_KEY }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"

      # 签名库来自私有仓库 kongbai，以 base64 存于 secrets。
      # 缺失时不阻断：产物为未签名 APK，仅标记。
      - name: 恢复签名库
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.KCU_KEYSTORE_BASE64 }}" | base64 -d > key-store.jks
          echo "签名库已恢复 $(stat -c%s key-store.jks) 字节"
      - name: 无签名库时告警
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: echo "::warning::未配置 KCU_KEYSTORE_BASE64，本次产物将未签名"

      - name: 确认存在 Android 源码
        id: guard
        run: |
          if [ -f "settings.gradle.kts" ] && [ -f "gradlew" ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未检测到 Android 源码基线，跳过编译。请先运行 sync-upstream 工作流导入上游。"
          fi

      - name: Grant execute permission
        if: steps.guard.outputs.has_source == 'true'
        run: chmod +x gradlew

      - name: Build release
        if: ${{ steps.guard.outputs.has_source == 'true' && github.event_name != 'pull_request' && (github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch) }}
        id: gradle
        run: |
          ./gradlew assembleRelease -Darch=${{ github.event.inputs.arch || matrix.arch }} --no-daemon 2>&1 | tee /tmp/build.log
          GE=${PIPESTATUS[0]}
          echo "gradle_exit=$GE"
          if [ "$GE" -eq 0 ]; then echo "GRADLE_OK=true" >> "$GITHUB_ENV"; else echo "GRADLE_OK=false" >> "$GITHUB_ENV"; fi
          { echo "BUILD_LOG<<EOF_DELIM"; tail -c 4000 /tmp/build.log; echo "EOF_DELIM"; } >> "$GITHUB_ENV"

      - name: Build debug
        if: ${{ steps.guard.outputs.has_source == 'true' && github.event_name == 'pull_request' && (github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch) }}
        id: gradle_debug
        run: |
          ./gradlew assembleDebug -Darch=${{ github.event.inputs.arch || matrix.arch }} --no-daemon 2>&1 | tee /tmp/build.log
          GE=${PIPESTATUS[0]}
          echo "gradle_exit=$GE"
          if [ "$GE" -eq 0 ]; then echo "GRADLE_OK=true" >> "$GITHUB_ENV"; else echo "GRADLE_OK=false" >> "$GITHUB_ENV"; fi
          { echo "BUILD_LOG<<EOF_DELIM"; tail -c 4000 /tmp/build.log; echo "EOF_DELIM"; } >> "$GITHUB_ENV"

      - name: 列出产物
        if: ${{ steps.guard.outputs.has_source == 'true' && (github.event.inputs.arch == '' || github.event.inputs.arch == matrix.arch) }}
        run: |
          APK_TXT=/tmp/apk.txt
          {
            echo "=== 产物清单 ==="
            find . -name "*.apk" -type f -printf "%p  %s bytes\n" | sort
            echo "=== sha256 ==="
            find . -name "*.apk" -type f -exec sha256sum {} \; | sort
          } | tee "$APK_TXT"
          { echo "APK_LISTING<<EOF_DELIM"; cat "$APK_TXT"; echo; echo "EOF_DELIM"; } >> "$GITHUB_ENV"

      - name: Upload APK
        if: steps.guard.outputs.has_source == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: app-${{ matrix.arch }}
          path: "*/build/outputs/apk/*/*.apk"
          if-no-files-found: warn

      - name: 构建结果上报（始终）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          arch = os.environ.get('MATRIX_ARCH', '?')
          listing = os.environ.get('APK_LISTING') or '(未生成产物清单)'
          log = os.environ.get('BUILD_LOG') or ''
          ok = os.environ.get('GRADLE_OK', '?')
          title = ("build 成功: " if ok == 'true' else "build 结果: ") + arch
          body = ("arch=" + arch + "\ngradle_ok=" + ok + "\n\n## 产物清单\n```\n"
                  + listing[-3000:] + "\n```")
          if ok != 'true' and log:
              body += "\n## 构建日志尾部\n```\n" + log[-4000:] + "\n```"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
              data=json.dumps({"title": title, "body": body}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
          try:
              print("issue:", json.load(urllib.request.urlopen(req, timeout=30)).get("html_url"))
          except Exception as e:
              print("上报失败:", e)
          PY
