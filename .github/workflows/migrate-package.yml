name: migrate-package

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.KCU_PAT }}

      - name: 迁移
        run: |
          set +e
          OUT=/tmp/diag.txt
          exec > >(tee $OUT) 2>&1
          echo "CWD=$(pwd)"
          echo "--- 1. 模块改名 FCL -> KCU（先做，保证 git mv 干净）---"
          test -d FCL && { git mv FCL KCU; echo "GITMV_EXIT=$?"; } || echo "NO_FCL"
          echo "--- 2. 跑迁移脚本 ---"
          python3 .github/scripts/migrate_package.py .
          echo "SCRIPT_EXIT=$?"
          echo "--- 3. settings ---"
          sed -i 's|include(":FCL")|include(":KCU")|g' settings.gradle.kts
          sed -i 's|rootProject.name = "Fold Craft Launcher"|rootProject.name = "KCU Launcher"|g' settings.gradle.kts
          cat settings.gradle.kts | grep -n 'include\|rootProject'
          echo "--- 4. 提交 ---"
          git config user.name "yuanbao"
          git config user.email "yuanbao@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.KCU_PAT }}@github.com/${{ github.repository }}.git"
          # workflow 文件需要 workflow scope，本 PAT 无此权限，故不纳入本次提交
          git checkout -- .github/workflows 2>/dev/null
          git reset -q HEAD .github/workflows 2>/dev/null
          git add -A
          echo "STAGED=$(git diff --cached --name-only | wc -l)"
          echo "WORKFLOW_STAGED=$(git diff --cached --name-only | grep -c '\.github/workflows/' || true)"
          if git diff --cached --quiet; then
            echo "RESULT=NO_CHANGE"
          else
            git commit -q -m "refactor: 包名迁移 com.tungsten.fcl*/com.mio -> com.kongbai.kculauncher* (yuanbao)"
            echo "COMMIT_EXIT=$?"
            git push origin "HEAD:${{ github.ref_name }}" 2>&1
            echo "PUSH_EXIT=$? RESULT=DONE"
          fi
          echo "--- git log ---"; git log --oneline -2
          exit 0

      - name: 输出诊断到 issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.KCU_PAT }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = open('/tmp/diag.txt', encoding='utf-8', errors='replace').read()
          if len(body) > 60000: body = body[:60000]
          payload = json.dumps({"title":"MIGRATE-DIAG","body":body}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/kongbai9288/KCU-Launcher/issues",
              data=payload, method="POST")
          req.add_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print("issue:", json.loads(r.read())["number"])
          except Exception as e:
              print("失败:", e)
          PY
