name: migrate-package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 运行迁移脚本（文本替换 + 包目录移动）
        run: |
          set -e
          python3 .github/scripts/migrate_package.py .

      - name: 模块改名 FCL -> KCU
        run: |
          set -e
          if [ -d FCL ]; then
            git mv FCL KCU || mv FCL KCU
          fi
          sed -i 's|include(":FCL")|include(":KCU")|g' settings.gradle.kts
          sed -i 's|rootProject.name = "Fold Craft Launcher"|rootProject.name = "KCU Launcher"|g' settings.gradle.kts
          # 其他 workflow / 脚本里若硬编码 :FCL 或 FCL/ 一并更新
          grep -rl ':FCL\|"FCL"\|FCL/build' .github/ 2>/dev/null | while read f; do
            sed -i 's|:FCL|:KCU|g; s|"FCL"|"KCU"|g; s|FCL/build|KCU/build|g' "$f"
          done
          echo "--- settings.gradle.kts ---"
          cat settings.gradle.kts

      - name: 残留自检
        run: |
          echo "=== 仍含 com.tungsten 的文件数 ==="
          grep -rl 'com\.tungsten\|com/tungsten\|com_tungsten' --include='*.java' --include='*.kt' --include='*.xml' --include='*.c' --include='*.h' --include='*.kts' . 2>/dev/null | grep -v '^./docs/' | head -40 || true
          grep -rl 'com\.tungsten\|com/tungsten\|com_tungsten' --include='*.java' --include='*.kt' --include='*.xml' --include='*.c' --include='*.h' --include='*.kts' . 2>/dev/null | grep -v '^./docs/' | wc -l || true
          echo "=== 仍含 com.mio 的源码文件数 ==="
          grep -rl 'com\.mio\|com/mio\|com_mio' --include='*.java' --include='*.kt' --include='*.xml' --include='*.c' --include='*.h' . 2>/dev/null | grep -v '^./docs/' | wc -l || true
          echo "=== FCL_VERSION_CODE 是否保留 ==="
          grep -rn 'FCL_VERSION_CODE' --include='*.java' --include='*.kt' . | head -5 || true

      - name: 提交
        run: |
          set -e
          git config user.name "yuanbao"
          git config user.email "yuanbao@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无改动，跳过提交"
          else
            git commit -m "refactor: 包名迁移 com.tungsten.fcl*/com.mio -> com.kongbai.kculauncher*，模块与项目名去 FCL 化 (yuanbao)"
            git push
          fi
