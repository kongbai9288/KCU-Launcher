name: migrate-package

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 迁移
        id: do
        run: |
          set +e
          OUT=/tmp/diag.txt
          exec > >(tee $OUT) 2>&1
          echo "CWD=$(pwd)"
          echo "--- ls 顶层 ---"; ls -1
          echo "--- FCL 是否存在 ---"; test -d FCL && echo YES || echo NO
          echo "--- 运行脚本 ---"
          python3 .github/scripts/migrate_package.py .
          echo "SCRIPT_EXIT=$?"
          echo "--- 模块改名 ---"
          if [ -d FCL ]; then git mv FCL KCU || mv FCL KCU; echo "MV_EXIT=$?"; else echo "NO_FCL"; fi
          sed -i 's|include(":FCL")|include(":KCU")|g' settings.gradle.kts
          sed -i 's|rootProject.name = "Fold Craft Launcher"|rootProject.name = "KCU Launcher"|g' settings.gradle.kts
          echo "--- settings ---"; cat settings.gradle.kts
          echo "--- git 状态 ---"
          git config user.name "yuanbao"
          git config user.email "yuanbao@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add -A
          echo "STAGED=$(git diff --cached --name-only | wc -l)"
          echo "--- porcelain head ---"; git status --porcelain | head -8
          if git diff --cached --quiet; then
            echo "RESULT=NO_CHANGE"
          else
            git commit -m "refactor: 包名迁移 com.tungsten.fcl*/com.mio -> com.kongbai.kculauncher* (yuanbao)"
            echo "COMMIT_EXIT=$?"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "PUSH_EXIT=$? RESULT=DONE"
          fi
          echo "--- git log ---"; git log --oneline -2
          exit 0

      - name: 输出诊断到 issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = open('/tmp/diag.txt', encoding='utf-8', errors='replace').read()
          if len(body) > 60000: body = body[:60000]
          payload = json.dumps({"title":"MIGRATE-DIAG","body":body}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/kongbai9288/KCU-Launcher/issues",
              data=payload, method="POST")
          req.add_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print("issue created:", json.loads(r.read())["number"])
          except Exception as e:
              print("issue 创建失败:", e)
          PY
